spring:
  application:
    name: learningService

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

gemini:
  baseurl: https://generativelanguage.googleapis.com/v1beta/
  models: gemini-3.8-flash,gemini-3.7-flash,gemini-3.5-flash-lite,gemini-flash-lite-latest

googleai:
  api:
    key:  ${GEMINI_API_KEY}


#Fallback para caso dê ruim no gemini gratuito
#anthropic:
  #api-key: ${ANTHROPIC_API_KEY}
  #model: claude-haiku-5-5



groq:
  api:
    key :  ${GEMINI_API_KEY}
  baseurl : https://api.groq.com/openai/v1
  models : openai/gpt-oss-120b, openai/gpt-oss-20b
  rate-limit:
    per-minute: 1

